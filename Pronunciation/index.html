<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pronunciation – Tiếng Anh Dì Lam</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef6ff, #f8fbff);
        color: #17324d;
        min-height: 100vh;
        padding: 30px 16px;
    }

    .container {
        max-width: 700px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 32px;
    }

    .logo {
        font-size: 52px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 32px;
    }

    .brand {
        margin-top: 8px;
        font-size: 16px;
        color: #718397;
    }

    .session {
        background: white;
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 18px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .session-label {
        font-size: 14px;
        color: #7b8fa3;
        margin-bottom: 6px;
    }

    .session-title {
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .session-description {
        color: #667788;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 16px;
    }

    .button {
        display: block;
        text-align: center;
        text-decoration: none;
        background: #2f80ed;
        color: white;
        padding: 13px 18px;
        border-radius: 12px;
        font-weight: bold;
    }

    .button:hover {
        background: #1769d1;
    }

    .coming {
        opacity: 0.65;
    }

    .coming .button {
        background: #aab5c0;
        pointer-events: none;
    }

    .footer {
        text-align: center;
        margin-top: 35px;
        color: #8a9aaa;
        font-size: 13px;
    }
</style>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🎧</div>

        <h1>PRONUNCIATION</h1>

        <div class="brand">

        </div>
    </div>


    <!-- SESSION 4 -->

    <div class="session">

        <div class="session-label">
            SESSION 4
        </div>

        <div class="session-title">

        <a class="button"
           href="Session4/">
            OPEN SESSION 4 →
        </a>

    </div>


    <!-- FUTURE SESSION -->

    <div class="session coming">

        <div class="session-label">
            SESSION 5
        </div>

        </div>

            New pronunciation practice will be available soon.
        </div>

        <div class="button">
            COMING SOON
        </div>

    </div>

        🌿 Tiếng Anh Dì Lam · Pronunciation Practice
