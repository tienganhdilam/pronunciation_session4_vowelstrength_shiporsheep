<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vowel Length Challenge</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eef6ff, #f8fbff);
  color: #17324d;
  min-height: 100vh;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 32px 18px 50px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #557087;
  margin-bottom: 24px;
  font-size: 17px;
}

.progress {
  background: white;
  border-radius: 14px;
  padding: 13px 17px;
  box-shadow: 0 4px 16px rgba(30,70,110,.08);
  margin-bottom: 22px;
  font-weight: 700;
}

.bar {
  height: 9px;
  background: #e7eef5;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: #2d8cff;
  transition: width .3s ease;
}

.question {
  background: white;
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 7px 25px rgba(30,70,110,.10);
}

.question-number {
  color: #2d8cff;
  font-weight: 800;
  font-size: 16px;
  margin-bottom: 12px;
}

.question-type {
  display: inline-block;
  background: #eef7ff;
  color: #2677c9;
  border-radius: 99px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 16px;
}

.instruction {
  font-size: 21px;
  font-weight: 800;
  line-height: 1.4;
  margin-bottom: 22px;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.option-box {
  text-align: center;
}

button.word {
  width: 100%;
  border: 2px solid #dbe7f1;
  background: #fff;
  border-radius: 16px;
  padding: 21px 14px;
  cursor: pointer;
  transition: .2s;
  font-size: 27px;
  font-weight: 800;
  color: #17324d;
}

button.word:hover:not(:disabled) {
  border-color: #6daefc;
  transform: translateY(-2px);
}

button.word:disabled {
  cursor: default;
}

button.word.correct {
  border-color: #22a06b;
  background: #eaf9f1;
}

button.word.wrong {
  border-color: #e05252;
  background: #fff0f0;
}

.listen {
  margin-top: 9px;
  border: none;
  background: #f0f5f9;
  color: #31566f;
  border-radius: 10px;
  padding: 8px 13px;
  font-size: 14px;
  cursor: pointer;
}

.listen:hover {
  background: #e2edf5;
}

.sample-box {
  background: #f5f9fd;
  border: 2px solid #dbe7f1;
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  margin-bottom: 20px;
}

.sample-label {
  color: #60798e;
  font-size: 14px;
  margin-bottom: 10px;
  font-weight: 700;
}

.sample-listen {
  border: none;
  background: #2d8cff;
  color: white;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.sample-listen:hover {
  opacity: .9;
}

.feedback {
  min-height: 30px;
  margin-top: 19px;
  font-size: 18px;
  font-weight: 800;
}

.correct-text {
  color: #188557;
}

.wrong-text {
  color: #cf3f3f;
}

.next-area {
  text-align: center;
  margin-top: 24px;
}

.next-button {
  display: none;
  border: none;
  background: #2d8cff;
  color: white;
  border-radius: 13px;
  padding: 13px 30px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}

.next-button:hover {
  opacity: .92;
}

.result {
  display: none;
  background: white;
  border-radius: 22px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(30,70,110,.12);
}

.result-title {
  font-size: 24px;
  font-weight: 800;
}

.score {
  font-size: 52px;
  font-weight: 900;
  color: #2d8cff;
  margin: 12px 0;
}

.message {
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.restart {
  border: none;
  background: #2d8cff;
  color: white;
  border-radius: 12px;
  padding: 12px 23px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.note {
  text-align: center;
  color: #71889b;
  font-size: 13px;
  margin-top: 20px;
}

.hidden {
  display: none;
}

@media (max-width: 600px) {
  h1 { font-size: 27px; }
  .question { padding: 22px; }
  .options { grid-template-columns: 1fr; }
  .instruction { font-size: 19px; }
}
</style>
</head>

<body>
<div class="container">

  <h1>🎧 Vowel Length Challenge</h1>
  <div class="subtitle">
    Listen carefully and choose the correct answer.
  </div>

  <div class="progress">
    <div>Question <span id="progressText">1 / 16</span></div>
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
  </div>

  <div id="quizArea"></div>

  <div class="result" id="result">
    <div class="result-title">🎉 Complete!</div>
    <div class="score" id="score">0 / 16</div>
    <div class="message" id="message"></div>
    <button class="restart" id="restartButton">🔄 Try Again</button>
  </div>

  <div class="note">
    💡 Listen for the vowel length before the final consonant.
  </div>

</div>

<script>
"use strict";

/* =====================================
   8 CẶP TỪ
===================================== */

const pairs = [
  { a: "bug",   b: "buck",  longWord: "bug" },
  { a: "kid",   b: "kit",   longWord: "kid" },
  { a: "bead",  b: "beat",  longWord: "bead" },
  { a: "seed",  b: "seat",  longWord: "seed" },
  { a: "hug",   b: "hut",   longWord: "hug" },
  { a: "knees", b: "niece", longWord: "knees" },
  { a: "bug",   b: "buck",  longWord: "bug" },
  { a: "leave", b: "leaf",  longWord: "leave" }
];

/* =====================================
   TẠO 16 CÂU
   8 câu dạng vowel length
   8 câu dạng nghe từ mẫu
===================================== */

let questions = [];

function createQuestions() {

  const list = [];

  pairs.forEach(function(pair, index) {

    /* Dạng 1 */
    list.push({
      type: "length",
      pairIndex: index,
      a: pair.a,
      b: pair.b,
      answer: pair.longWord === pair.a ? 0 : 1
    });

    /* Dạng 2 */
    const sampleIndex = Math.random() < 0.5 ? 0 : 1;

    list.push({
      type: "listen",
      pairIndex: index,
      a: pair.a,
      b: pair.b,
      sample: sampleIndex === 0 ? pair.a : pair.b,
      answer: sampleIndex
    });
  });

  /* Xáo trộn toàn bộ 16 câu */
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }

  return list;
}


/* =====================================
   ÂM THANH
===================================== */

let voices = [];

function loadVoices() {
  if ("speechSynthesis" in window) {
    voices = window.speechSynthesis.getVoices();
  }
}

loadVoices();

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(word) {

  if (!("speechSynthesis" in window)) {
    alert("Trình duyệt của bạn không hỗ trợ phát âm thanh.");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(word);

  utterance.lang = "en-US";
  utterance.rate = 0.78;
  utterance.pitch = 1;

  const voice =
    voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("en-us")
    ) ||
    voices.find(v =>
      v.lang && v.lang.toLowerCase().startsWith("en")
    );

  if (voice) {
    utterance.voice = voice;
  }

  window.speechSynthesis.speak(utterance);
}


/* =====================================
   TRẠNG THÁI BÀI
===================================== */

let currentQuestion = 0;
let score = 0;
let answeredCurrent = false;


/* =====================================
   HIỂN THỊ TIẾN ĐỘ
===================================== */

function updateProgress() {

  const current = currentQuestion + 1;

  document.getElementById("progressText").textContent =
    current + " / " + questions.length;

  document.getElementById("fill").style.width =
    (currentQuestion / questions.length * 100) + "%";
}


/* =====================================
   HIỂN THỊ CÂU HỎI
===================================== */

function renderQuestion() {

  answeredCurrent = false;

  const q = questions[currentQuestion];
  const area = document.getElementById("quizArea");

  area.innerHTML = "";

  const card = document.createElement("div");
  card.className = "question";

  const typeText =
    q.type === "length"
      ? "VOWEL LENGTH"
      : "LISTEN & CHOOSE";

  const instruction =
    q.type === "length"
      ? "Từ nào có nguyên âm kéo dài hơn?"
      : "Nghe từ mẫu. Chọn đáp án đúng.";

  let sampleHTML = "";

  if (q.type === "listen") {
    sampleHTML = `
      <div class="sample-box">
        <div class="sample-label">🔊 TỪ MẪU</div>
        <button class="sample-listen" id="sampleButton">
          🔊 Nghe từ mẫu
        </button>
      </div>
    `;
  }

  card.innerHTML = `
    <div class="question-number">
      Câu ${currentQuestion + 1}
    </div>

    <div class="question-type">
      ${typeText}
    </div>

    <div class="instruction">
      ${instruction}
    </div>

    ${sampleHTML}

    <div class="options">

      <div class="option-box">
        <button class="word" data-choice="0">
          ${q.a}
        </button>
        <br>
        <button class="listen" data-word="${q.a}">
          🔊 Nghe ${q.a}
        </button>
      </div>

      <div class="option-box">
        <button class="word" data-choice="1">
          ${q.b}
        </button>
        <br>
        <button class="listen" data-word="${q.b}">
          🔊 Nghe ${q.b}
        </button>
      </div>

    </div>

    <div class="feedback" id="feedback"></div>

    <div class="next-area">
      <button class="next-button" id="nextButton">
        ${currentQuestion === questions.length - 1
          ? "Xem kết quả"
          : "Next →"}
      </button>
    </div>
  `;

  area.appendChild(card);

  /* Nút nghe từ */
  card.querySelectorAll(".listen").forEach(function(button) {
    button.addEventListener("click", function() {
      speak(button.dataset.word);
    });
  });

  /* Nút đáp án */
  card.querySelectorAll(".word").forEach(function(button) {
    button.addEventListener("click", function() {
      chooseAnswer(Number(button.dataset.choice));
    });
  });

  /* Nút nghe mẫu */
  const sampleButton = document.getElementById("sampleButton");

  if (sampleButton) {
    sampleButton.addEventListener("click", function() {
      speak(q.sample);
    });
  }

  /* Nút Next */
  document.getElementById("nextButton")
    .addEventListener("click", nextQuestion);

  updateProgress();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================
   CHỌN ĐÁP ÁN
===================================== */

function chooseAnswer(choice) {

  if (answeredCurrent) {
    return;
  }

  answeredCurrent = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".word");

  const feedback =
    document.getElementById("feedback");

  /* Không cho chọn lại */
  buttons.forEach(function(button) {
    button.disabled = true;
  });

  /* Đánh dấu đáp án đúng */
  buttons[q.answer].classList.add("correct");

  if (choice === q.answer) {

    score++;

    feedback.textContent = "✅ Chính xác!";
    feedback.className = "feedback correct-text";

  } else {

    buttons[choice].classList.add("wrong");

    if (q.type === "length") {

      feedback.textContent =
        "❌ Chưa đúng. Đáp án là: " +
        (q.answer === 0 ? q.a : q.b);

    } else {

      feedback.textContent =
        "❌ Chưa đúng. Từ mẫu là: " +
        q.sample;

    }

    feedback.className = "feedback wrong-text";
  }

  /* Hiện nút Next */
  document.getElementById("nextButton").style.display =
    "inline-block";
}


/* =====================================
   NEXT
===================================== */

function nextQuestion() {

  if (!answeredCurrent) {
    return;
  }

  if (currentQuestion === questions.length - 1) {
    showResult();
    return;
  }

  currentQuestion++;

  renderQuestion();
}


/* =====================================
   KẾT QUẢ
===================================== */

function showResult() {

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById("quizArea").innerHTML = "";

  document.querySelector(".progress").style.display = "none";

  const result =
    document.getElementById("result");

  const scoreElement =
    document.getElementById("score");

  const message =
    document.getElementById("message");

  scoreElement.textContent =
    score + " / " + questions.length;

  let comment;

  if (score === 16) {
    comment =
      "🌟 Xuất sắc! Bạn phân biệt vowel length rất tốt!";
  } else if (score >= 13) {
    comment =
      "👏 Rất tốt! Khả năng nghe của bạn rất ổn.";
  } else if (score >= 10) {
    comment =
      "💪 Khá tốt! Hãy luyện thêm những cặp còn nhầm.";
  } else {
    comment =
      "🎧 Hãy nghe lại từng cặp và chú ý độ dài nguyên âm.";
  }

  message.textContent = comment;

  result.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================
   LÀM LẠI
===================================== */

function restartQuiz() {

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  currentQuestion = 0;
  score = 0;
  answeredCurrent = false;

  questions = createQuestions();

  document.querySelector(".progress").style.display =
    "block";

  document.getElementById("result").style.display =
    "none";

  renderQuestion();
}


/* =====================================
   KHỞI ĐỘNG
===================================== */

document.getElementById("restartButton")
  .addEventListener("click", restartQuiz);

questions = createQuestions();

renderQuestion();

</script>
</body>
</html>
